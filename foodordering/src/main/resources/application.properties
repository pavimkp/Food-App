spring.application.name=foodordering
server.port=8080

# --- Database (secrets come from environment variables, never hard-code them) ---
spring.datasource.url=jdbc:mysql://localhost:3306/food_ordering_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:food_app}
spring.datasource.password=Foodapp123

# --- JPA / Hibernate ---
# validate = only CHECK that entities match our hand-written tables; never change the schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# --- Admin login for /api/admin/** (HTTP Basic) ---
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=adminapp123

# --- CORS: which frontends may call this API (comma separated) ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
